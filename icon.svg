<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo oscuro PWA -->
  <rect width="512" height="512" rx="110" fill="#121212"/>
  
  <!-- Anillo exterior rojo TMSA -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#dc2626" stroke-width="14" opacity="0.9"/>
  
  <!-- Silueta de Autobús Interurbano TMSA -->
  <g transform="translate(106, 96)">
    <!-- Cuerpo principal del bus -->
    <rect x="10" y="20" width="280" height="300" rx="40" fill="#dc2626"/>
    
    <!-- Parabrisas / Ventanal delantero superior -->
    <rect x="30" y="45" width="240" height="100" rx="16" fill="#121212"/>
    
    <!-- Faros delanteros -->
    <circle cx="60" cy="275" r="20" fill="#ffffff"/>
    <circle cx="240" cy="275" r="20" fill="#ffffff"/>
    
    <!-- Matrícula / Cartel de Línea -->
    <rect x="110" y="265" width="80" height="20" rx="5" fill="#121212"/>
    <text x="150" y="280" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ef4444" text-anchor="middle">TMSA</text>

    <!-- Retrovisores de autobús -->
    <path d="M 10 90 L -10 110 L -10 140 L 10 120 Z" fill="#dc2626"/>
    <path d="M 290 90 L 310 110 L 310 140 L 290 120 Z" fill="#dc2626"/>
    
    <!-- Ruedas -->
    <rect x="40" y="310" width="50" height="25" rx="8" fill="#27272a"/>
    <rect x="210" y="310" width="50" height="25" rx="8" fill="#27272a"/>
  </g>
</svg>
